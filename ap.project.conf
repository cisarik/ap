[ap]
	schemaVersion = 1
	projectId = cisarik/ap
	environmentPolicy = sanitized-v1

[runtime "cpython"]
	kind = cpython
	executable = .venv/bin/python
	requiredVersion = 3.14

[operation "runtime-info"]
	workingDirectory = .
	argv = -c
	argv = import sys; print(sys.executable); print(sys.version)
	allowTrailingArgv = false
